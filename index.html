<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengecekan Berkala Motor - PMP</title>
    <!-- Bootstrap CSS untuk tampilan rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Data Pengecekan Berkala Motor</h1>
            <p class="text-muted">Data dimuat secara real-time langsung dari Google Sheets (Filter: Ganti Motor)</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div id="table-container">
                    <p class="text-center text-secondary">Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script otomatis mengambil data dari Google Sheets Web App -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaKVBoR7ictxN1pYu0LAiaHARvltJlwlqV1wDsoz96_enjB7pi6bqAWLkHx-JTEnrx/exec";

        fetch(APPS_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('table-container');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-danger">Belum ada data yang cocok.</p>';
                    return;
                }

                let html = '<div class="table-responsive"><table class="table table-striped table-bordered align-middle"><thead class="table-primary"><tr>';
                
                // Header Tabel berdasarkan kolom Sheet
                const headers = ["No", "Nama Pekerjaan", "PIC", "Personil", "Line", "Mesin", "Sub Mesin", "Fokus", "Prioritas", "Jadwal Rencana"];
                headers.forEach(h => html += `<th>${h}</th>`);
                html += '</tr></thead><tbody>';

                data.forEach((row, index) => {
                    html += '<tr>';
                    html += `<td>${index + 1}</td>`;
                    row.forEach(cell => {
                        html += `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
                container.innerHTML = html;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('table-container').innerHTML = '<p class="text-center text-danger">Gagal memuat data.</p>';
            });
    </script>
</body>
</html>
