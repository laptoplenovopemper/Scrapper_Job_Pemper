name: Run Daily Job Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap pukul 07:00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Tanggal Mulai (YYYY-MM-DD)'
        required: true
        default: '2026-10-01'
      date_to:
        description: 'Tanggal Selesai (YYYY-MM-DD)'
        required: true
        default: '2026-11-10'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager requests

      - name: Run Scraper Script
        env:
          SCRAPER_USERNAME: ${{ secrets.SCRAPER_USERNAME }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
          # Menerima input tanggal dari web app atau default dari schedule
          INPUT_DATE_FROM: ${{ github.event.inputs.date_from }}
          INPUT_DATE_TO: ${{ github.event.inputs.date_to }}
        run: |
          python scraper.py
