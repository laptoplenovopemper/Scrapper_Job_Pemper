name: Run Daily Job Scraper

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Tanggal Mulai (YYYY-MM-DD)'
        required: true
        type: string
      date_to:
        description: 'Tanggal Selesai (YYYY-MM-DD)'
        required: true
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 gspread oauth2client selenium webdriver-manager

      - name: Run Scraper Script
        env:
          SCRAPER_USERNAME: ${{ secrets.SCRAPER_USERNAME }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
          INPUT_DATE_FROM: ${{ github.event.inputs.date_from }}
          INPUT_DATE_TO: ${{ github.event.inputs.date_to }}
        run: |
          python scraper.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_error.png
